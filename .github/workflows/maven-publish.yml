name: Build Maven Plugin

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 25 is required to read the ExcellentEconomy dependency (Java 25 bytecode).
          # The plugin itself is still compiled to Java 21 (see maven.compiler.* in pom.xml).
          java-version: '25'
          cache: maven

      - name: Maven Build
        run: mvn clean package
